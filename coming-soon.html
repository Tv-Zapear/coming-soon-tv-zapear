<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Zapear - Coming Soon</title>
  <style>
    /* ========================================================================
       DESIGN TOKENS - TV Zapear
       ======================================================================== */
    
    :root {
      /* Colors */
      --color-primary: #b537f2;
      --color-primary-dark: #a020d9;
      --color-primary-light: #d97ef9;
      
      --color-background: #0a0a0f;
      --color-surface: #1a1a1f;
      --color-surface-light: #2a2a30;
      
      --color-text-primary: #ffffff;
      --color-text-secondary: #b0b0b8;
      --color-text-muted: #6b6b73;
      
      --color-accent: #00d4ff;
      --color-accent-dark: #00a8cc;
      
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-error: #ef4444;
      
      /* Typography */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      --font-size-4xl: 2.25rem;
      --font-size-5xl: 3rem;
      --font-size-6xl: 3.75rem;
      
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      
      /* Spacing */
      --spacing-xs: 0.25rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;
      --spacing-2xl: 3rem;
      --spacing-3xl: 4rem;
      --spacing-4xl: 6rem;
      
      /* Border Radius */
      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-2xl: 1.5rem;
      --radius-full: 9999px;
      
      /* Shadows */
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      
      /* Glow Effects */
      --glow-primary: 0 0 20px rgba(181, 55, 242, 0.5);
      --glow-accent: 0 0 30px rgba(0, 212, 255, 0.4);
    }
    
    /* ========================================================================
       RESET & BASE STYLES
       ======================================================================== */
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: var(--font-family);
      background-color: var(--color-background);
      color: var(--color-text-primary);
      line-height: 1.6;
      overflow-x: hidden;
    }
    
    /* ========================================================================
       ANIMATIONS
       ======================================================================== */
    
    @keyframes glow-pulse {
      0%, 100% {
        text-shadow: 
          0 0 10px rgba(181, 55, 242, 0.5),
          0 0 20px rgba(181, 55, 242, 0.3),
          0 0 30px rgba(181, 55, 242, 0.2);
        filter: drop-shadow(0 0 10px rgba(181, 55, 242, 0.4));
      }
      50% {
        text-shadow: 
          0 0 20px rgba(181, 55, 242, 0.8),
          0 0 40px rgba(181, 55, 242, 0.6),
          0 0 60px rgba(181, 55, 242, 0.4);
        filter: drop-shadow(0 0 20px rgba(181, 55, 242, 0.8));
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }
    
    @keyframes fade-in {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
    @keyframes slide-up {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
    
    /* ========================================================================
       LAYOUT
       ======================================================================== */
    
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 var(--spacing-md);
    }
    
    /* ========================================================================
       HERO SECTION
       ======================================================================== */
    
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        135deg,
        var(--color-background) 0%,
        #1a0a2e 50%,
        var(--color-background) 100%
      );
    }
    
    /* Background animated elements */
    .hero::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(181, 55, 242, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      top: -100px;
      left: -100px;
      animation: float 6s ease-in-out infinite;
    }
    
    .hero::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -50px;
      right: -50px;
      animation: float 8s ease-in-out infinite reverse;
    }
    
    .hero-content {
      position: relative;
      z-index: 10;
      text-align: center;
      animation: fade-in 1s ease-out;
    }
    
    /* ========================================================================
       COMING SOON TEXT - GLOWING EFFECT
       ======================================================================== */
    
    .coming-soon {
      font-size: var(--font-size-6xl);
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
      margin-bottom: var(--spacing-2xl);
      animation: glow-pulse 3s ease-in-out infinite;
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.2;
    }
    
    /* Responsive font size */
    @media (max-width: 768px) {
      .coming-soon {
        font-size: var(--font-size-4xl);
      }
    }
    
    @media (max-width: 480px) {
      .coming-soon {
        font-size: var(--font-size-3xl);
      }
    }
    
    /* ========================================================================
       SUBTITLE
       ======================================================================== */
    
    .subtitle {
      font-size: var(--font-size-xl);
      color: var(--color-text-secondary);
      margin-bottom: var(--spacing-3xl);
      animation: slide-up 1s ease-out 0.2s both;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    
    /* ========================================================================
       CTA BUTTON
       ======================================================================== */
    
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--spacing-md);
      padding: var(--spacing-lg) var(--spacing-3xl);
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-lg);
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: all 0.3s ease;
      animation: slide-up 1s ease-out 0.4s both;
      box-shadow: 0 0 20px rgba(181, 55, 242, 0.3);
      text-decoration: none;
    }
    
    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(181, 55, 242, 0.6);
    }
    
    .cta-button:active {
      transform: translateY(0);
    }
    
    /* ========================================================================
       FLOATING ELEMENTS
       ======================================================================== */
    
    .floating-element {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-lg);
      opacity: 0.1;
      animation: float 8s ease-in-out infinite;
    }
    
    .floating-element:nth-child(1) {
      top: 10%;
      right: 10%;
      animation-delay: 0s;
    }
    
    .floating-element:nth-child(2) {
      bottom: 20%;
      left: 5%;
      animation-delay: 2s;
    }
    
    .floating-element:nth-child(3) {
      top: 50%;
      right: 5%;
      animation-delay: 4s;
    }
    
    /* ========================================================================
       FOOTER
       ======================================================================== */
    
    .footer {
      position: absolute;
      bottom: var(--spacing-2xl);
      left: 0;
      right: 0;
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--font-size-sm);
      z-index: 5;
    }
    
    .footer a {
      color: var(--color-primary);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    
    .footer a:hover {
      color: var(--color-primary-light);
    }
    
    /* ========================================================================
       RESPONSIVE
       ======================================================================== */
    
    @media (max-width: 768px) {
      .hero {
        padding: var(--spacing-2xl) 0;
      }
      
      .subtitle {
        font-size: var(--font-size-base);
      }
      
      .cta-button {
        padding: var(--spacing-md) var(--spacing-2xl);
        font-size: var(--font-size-base);
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <!-- Floating decorative elements -->
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    <div class="floating-element"></div>
    
    <!-- Main content -->
    <div class="hero-content">
      <h1 class="coming-soon">Coming Soon</h1>
      <p class="subtitle">
        A experiência de TV ao vivo que você sempre esperou está chegando. Prepare-se para uma jornada épica pelo mundo do entretenimento.
      </p>
      <button class="cta-button" onclick="alert('Notificação ativada! Você receberá um email quando lançarmos.')">
        Notifique-me
      </button>
    </div>
    
    <!-- Footer -->
    <div class="footer">
      <p>© 2026 TV Zapear. Todos os direitos reservados. | <a href="#">Privacidade</a> | <a href="#">Termos</a></p>
    </div>
  </div>
</body>
</html>
